services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-home-emqx:6.3.1
    container_name: smart-home-emqx
    hostname: broker.smart-home.local
    restart: unless-stopped
    environment:
      - EMQX_NODE_NAME=emqx@broker.smart-home.local
      - EMQX_SECURITY_PROFILE=legacy
    ports:
      - "1883:1883"               # MQTT TCP for ESP32, Android App, MQTTX
      - "8083:8083"               # MQTT WebSocket for Mobile App / Prototype
      - "127.0.0.1:18083:18083"   # EMQX Dashboard (access via http://localhost:18083)
    volumes:
      - smart-home-emqx-data:/opt/emqx/data
      - smart-home-emqx-log:/opt/emqx/log

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: smart-home-web-server:latest
    container_name: smart-home-web-server
    restart: unless-stopped
    depends_on:
      - broker
    environment:
      - MQTT_BROKER=broker
      - MQTT_PORT=1883
      - WEB_HOST=0.0.0.0
      - WEB_PORT=5000
    volumes:
      - ./server/data:/app/data   # Persist rules across container restarts
    ports:
      - "5000:5000"               # Web Dashboard (access via http://localhost:5000)

volumes:
  smart-home-emqx-data:
    name: smart-home-emqx-data
  smart-home-emqx-log:
    name: smart-home-emqx-log
