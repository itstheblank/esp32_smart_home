name: Mobile CI (UI Dashboard)

on:
  push:
    branches:
      - main
      - dev
      - feat/ui-dashboard
      - "feat/**"
      - "fix/**"
      - "member*/**"
    paths:
      - "mobile_app/**"
      - "packages/**"
      - ".github/workflows/mobile-ci.yml"
      - "docs/mqtt-contract.json"
      - "pnpm-lock.yaml"
      - "package.json"
  pull_request:
    branches:
      - main
      - dev
      - feat/ui-dashboard
    paths:
      - "mobile_app/**"
      - "packages/**"
      - ".github/workflows/mobile-ci.yml"
      - "docs/mqtt-contract.json"
      - "pnpm-lock.yaml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  # ─── 1. Lint, Code Style & Contract Guard ─────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter mobile_app run lint

      - name: Check Prettier formatting
        run: pnpm --filter mobile_app run format:check

      - name: Validate MQTT Contract Integrity
        run: pnpm --filter mobile_app run validate:contract

  # ─── 2. SDK & Dependency Health (Expo Doctor) ──────────────────────────────
  doctor:
    name: Expo Doctor (SDK Compatibility)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Expo Doctor Diagnostics
        run: pnpm --filter mobile_app run doctor

  # ─── 3. Unit Tests (Vitest) ────────────────────────────────────────────────
  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm turbo run test

  # ─── 4. Export & Metro Bundle Verification ─────────────────────────────────
  build-check:
    name: Android Bundle & Export Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Android Production Bundle Export
        run: pnpm --filter mobile_app exec expo export --platform android --output-dir dist
