[platformio]
default_envs = wt32-eth01

[env:wt32-eth01]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    madhephaestus/ESP32Servo@^3.0.5
    miguelbalboa/MFRC522@^1.4.12

[env:native]
platform = native
test_framework = unity
build_flags = -I src -std=c++11
build_src_filter = -<*>
extra_scripts = pre:scripts/native_test_build.py
; Tests are header-only pure logic; firmware sources (Arduino.h) are built by
; [env:wt32-eth01]. Run checks: `pio run -e wt32-eth01` + `pio test -e native`.

